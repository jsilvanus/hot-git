[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hot-git"
version = "0.3.0"
description = "Fast, treeless Git repository access"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["hotgit*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
